name: Rust

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          # Extra targets the code claims to support but the native host does not cover:
          # 32-bit Windows (cfg(target_pointer_width = "32") in windows.rs) and musl
          # (a different libc: cmsghdr.cmsg_len is u32, not usize).
          - os: ubuntu-latest
            extra_target: x86_64-unknown-linux-musl
            extra_target_tests: false
          - os: windows-latest
            extra_target: i686-pc-windows-msvc
            extra_target_tests: true

    steps:
      - uses: actions/checkout@v4

      - name: Configure ICMP permissions (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo sysctl -w net.ipv4.ping_group_range="0 65535"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          targets: ${{ matrix.extra_target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Run clippy (${{ matrix.extra_target }})
        if: matrix.extra_target != ''
        run: cargo clippy --all-targets --all-features --target ${{ matrix.extra_target }} -- -D warnings

      - name: Run tests (${{ matrix.extra_target }})
        if: matrix.extra_target_tests
        run: cargo test --verbose --target ${{ matrix.extra_target }}

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit
